[project]
name = "tf2-neural-network-validation-regularization-iris"
version = "0.1.0"
description = "Validation and regularisation of a TensorFlow 2 / Keras neural network on the Iris dataset: dropout, L2 weight decay, batch normalisation and training callbacks."
readme = "README.md"
authors = [
    { name = "Diego Ramirez Rosas", email = "ramirezgrosas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
]

[project.scripts]
tf2-neural-network-validation-regularization-iris = "tf2_neural_network_validation_regularization_iris:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
